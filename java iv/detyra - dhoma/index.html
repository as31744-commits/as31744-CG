<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Java IV - Detyra: Dhoma e ngrenies</title>
        <style>
            body { margin: 0; overflow: hidden; background: #1d1a17; }
            #scene canvas { display: block; }
            #info {
                position: absolute;
                top: 12px;
                left: 12px;
                max-width: 300px;
                padding: 12px 16px;
                background: rgba(255, 252, 246, 0.88);
                color: #2b2620;
                font-family: Arial, sans-serif;
                font-size: 13px;
                line-height: 1.5;
                border-radius: 8px;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            }
            #info h1 { font-size: 16px; margin: 0 0 6px; }
            #info ul { margin: 4px 0; padding-left: 18px; }
            #info .small { font-size: 11px; color: #6b6258; }
            #loading {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #f4ede2;
                font-family: Arial, sans-serif;
                font-size: 16px;
                background: #1d1a17;
                transition: opacity 0.6s;
            }
        </style>
    </head>
    <body>
        <div id="scene"></div>
        <div id="info">
            <h1>Dhoma e ngrenies</h1>
            Tavolina + 6 karrike, te shkallezuara, zhvendosura dhe rrotulluara rreth saj.
            <ul>
                <li>Mausi - rrotullo / zmadho / zhvendos kameren</li>
                <li><b>N</b> - dite / nate (dritat e llambave)</li>
            </ul>
            <span class="small">Modelet dhe teksturat: Poly Haven (CC0) - polyhaven.com</span>
        </div>
        <div id="loading">Duke ngarkuar modelet... 0%</div>
        <script type="module" src="index.js"></script>
    </body>
</html>
